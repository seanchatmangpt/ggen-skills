[project]
name = "ggen-skills"
version = "0.1.0"
description = "Ontology-first governed manufacture of portable agent skills and meta-skills"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[inference]
rules = [
  { name = "normalize", construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o }" }
]

[[generation.rules]]
name = "meta-router-codex"
query = { inline = """
PREFIX prov: <http://www.w3.org/ns/prov#>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
SELECT ?name ?title ?description ?body ?effect ?authority ?falsifier ?runtime WHERE {
  ?skill a prov:Entity ; dcterms:type "META_SKILL" ; dcterms:identifier ?name ; dcterms:title ?title ; dcterms:description ?description ; dcterms:abstract ?body ; dcterms:relation ?effect ; dcterms:accessRights ?authority ; skos:scopeNote ?falsifier .
  ?runtimeEntity a prov:Entity ; dcterms:type "RUNTIME" ; dcterms:identifier ?runtime .
  FILTER(?name = "meta-router" && ?runtime = "codex")
}
""" }
template = { file = "templates/skill.md.tera" }
output_file = "projections/codex/meta-router/SKILL.md"
mode = "Overwrite"

