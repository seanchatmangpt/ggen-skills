name: Core Team DoD

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-team-dod-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Exact-head equivalence manufacture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GGEN_RELEASE: v26.8.27
      GGEN_ASSET: ggen-x86_64-unknown-linux-gnu.tar.gz
      GGEN_ASSET_SHA256: ab442ced90a9836fd4eb07a5d61eb58293843cd515d864699fc0d0453444a035
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact subject
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "REFUSED[EXACT_HEAD_MISMATCH]: expected=$EXPECTED_SHA actual=$actual" >&2; exit 2; }
          mkdir -p artifacts/core-team-dod
          printf '%s\n' "$actual" > artifacts/core-team-dod/subject-sha.txt

      - name: Structural and source qualification
        run: |
          set -euo pipefail
          python3 tools/verify.py | tee artifacts/core-team-dod/structural.log
          python3 tools/verify_manufacturing.py source | tee artifacts/core-team-dod/manufacturing-source.log
          python3 tools/verify_manufacturing.py falsify | tee artifacts/core-team-dod/falsify.log
          python3 -m unittest discover -s tests -v 2>&1 | tee artifacts/core-team-dod/tests.log

      - name: Preserve current consequence as semantic candidate
        run: |
          set -euo pipefail
          python3 tools/export_skill_content.py --output manufacturing/ontology/skill-content.ttl | tee artifacts/core-team-dod/export.log
          python3 tools/verify_manufacturing.py ontology | tee artifacts/core-team-dod/ontology-verify.log
          cp manufacturing/ontology/skill-content.ttl artifacts/core-team-dod/skill-content.ttl
          before="$(python3 tools/verify_manufacturing.py snapshot)"
          printf '%s\n' "$before" | tee artifacts/core-team-dod/snapshot-before.sha256
          printf 'SNAPSHOT_BEFORE=%s\n' "$before" >> "$GITHUB_ENV"

      - name: Install pinned GGen producer
        run: |
          set -euo pipefail
          url="https://github.com/seanchatmangpt/ggen/releases/download/${GGEN_RELEASE}/${GGEN_ASSET}"
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/$GGEN_ASSET"
          printf '%s  %s\n' "$GGEN_ASSET_SHA256" "$RUNNER_TEMP/$GGEN_ASSET" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ggen-bin"
          tar -xzf "$RUNNER_TEMP/$GGEN_ASSET" -C "$RUNNER_TEMP/ggen-bin"
          producer="$(find "$RUNNER_TEMP/ggen-bin" -type f -name ggen -perm -u+x -print -quit)"
          test -n "$producer" || { echo "BUILD_BROKEN[GGEN_BINARY_MISSING]" >&2; exit 3; }
          printf '%s\n' "$(dirname "$producer")" >> "$GITHUB_PATH"
          "$producer" --version | tee artifacts/core-team-dod/ggen-version.txt

      - name: Manufacture and prove predecessor equivalence
        run: |
          set -euo pipefail
          ggen sync run 2>&1 | tee artifacts/core-team-dod/sync-1.log
          if test -f .ggen-v2/receipt.json; then cp .ggen-v2/receipt.json artifacts/core-team-dod/ggen-receipt-1.json; fi
          ggen receipt verify --format json | tee artifacts/core-team-dod/receipt-verify-1.json
          after="$(python3 tools/verify_manufacturing.py snapshot)"
          printf '%s\n' "$after" | tee artifacts/core-team-dod/snapshot-after.sha256
          test "$SNAPSHOT_BEFORE" = "$after" || { echo "REFUSED[NON_EQUIVALENT_RECONSTITUTION]: before=$SNAPSHOT_BEFORE after=$after" >&2; exit 2; }
          git diff --exit-code -- skills AGENTS.md README.md || { echo "REFUSED[NON_EQUIVALENT_RECONSTITUTION]: generated bytes differ from preserved consequence" >&2; exit 2; }
          python3 tools/verify.py | tee artifacts/core-team-dod/post-manufacture-structural.log
          printf 'SNAPSHOT_AFTER=%s\n' "$after" >> "$GITHUB_ENV"

      - name: Replay and prove byte identity
        run: |
          set -euo pipefail
          ggen sync run 2>&1 | tee artifacts/core-team-dod/sync-2.log
          if test -f .ggen-v2/receipt.json; then cp .ggen-v2/receipt.json artifacts/core-team-dod/ggen-receipt-2.json; fi
          ggen receipt verify --format json | tee artifacts/core-team-dod/receipt-verify-2.json
          replay="$(python3 tools/verify_manufacturing.py snapshot)"
          printf '%s\n' "$replay" | tee artifacts/core-team-dod/snapshot-replay.sha256
          test "$SNAPSHOT_AFTER" = "$replay" || { echo "REFUSED[NON_DETERMINISTIC_REPLAY]: first=$SNAPSHOT_AFTER replay=$replay" >&2; exit 2; }
          git diff --exit-code -- skills AGENTS.md README.md || { echo "REFUSED[REPLAY_DRIFT]" >&2; exit 2; }
          printf 'SNAPSHOT_REPLAY=%s\n' "$replay" >> "$GITHUB_ENV"

      - name: Bind exact-subject receipt
        if: always()
        run: |
          set -euo pipefail
          git diff --check || true
          git status --short > artifacts/core-team-dod/git-status.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts/core-team-dod')
          def sha(path):
              p=Path(path); h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          receipt = {
            'schema': 'https://seanchatmangpt.github.io/ggen-skills/receipts/core-team-dod/v1',
            'repository': os.environ['GITHUB_REPOSITORY'],
            'subject_sha': os.environ['EXPECTED_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'producer': {'release': os.environ['GGEN_RELEASE'], 'asset': os.environ['GGEN_ASSET'], 'asset_sha256': os.environ['GGEN_ASSET_SHA256']},
            'source_lock_sha256': sha('SOURCE.lock.json'),
            'semantic_candidate_sha256': sha('manufacturing/ontology/skill-content.ttl') if Path('manufacturing/ontology/skill-content.ttl').exists() else None,
            'projection_snapshot_before': os.environ.get('SNAPSHOT_BEFORE'),
            'projection_snapshot_after': os.environ.get('SNAPSHOT_AFTER'),
            'projection_snapshot_replay': os.environ.get('SNAPSHOT_REPLAY'),
            'equivalent_to_predecessor': bool(os.environ.get('SNAPSHOT_AFTER')) and os.environ.get('SNAPSHOT_BEFORE') == os.environ.get('SNAPSHOT_AFTER'),
            'replay_identical': bool(os.environ.get('SNAPSHOT_REPLAY')) and os.environ.get('SNAPSHOT_AFTER') == os.environ.get('SNAPSHOT_REPLAY'),
            'standing': {
              'structural_constitution': 'ALIVE',
              'ggen_equivalence_rail': 'ALIVE' if os.environ.get('SNAPSHOT_REPLAY') and os.environ.get('SNAPSHOT_BEFORE') == os.environ.get('SNAPSHOT_REPLAY') else 'PARTIAL_ALIVE',
              'semantic_authority_inversion': 'PARTIAL_ALIVE',
              'individual_skill_behavior': 'PARTIAL_ALIVE',
              'external_actuation': 'REFUSED:NO_AUTHORITY'
            }
          }
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          (cd artifacts/core-team-dod && sha256sum -- * > SHA256SUMS)

      - name: Upload exact-head replay evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-team-dod-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/core-team-dod/
          retention-days: 14
