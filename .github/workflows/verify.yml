name: Verify ggen-skills APS Factory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-skills-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Establish exact-head coordinate
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          echo "GGEN_SKILLS_HEAD=$candidate" >> "$GITHUB_ENV"

      - name: Install pinned semantic qualification stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          python3 -m py_compile tools/verify.py tests/test_repository.py

      - name: Verify admitted APS source coordinates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          python3 - <<'PY' > evidence/source/coordinates.tsv
          import json
          from pathlib import Path
          lock = json.loads(Path("SOURCE.lock.json").read_text())
          src = lock["source"]
          print(src["repository"], src["commit"], sep="\t")
          for path, blob in sorted(src["blobs"].items()):
              print(path, blob, sep="\t")
          PY
          read -r source_repo source_commit < <(head -n 1 evidence/source/coordinates.tsv)
          tail -n +2 evidence/source/coordinates.tsv | while IFS=$'\t' read -r path expected; do
            tmp="$(mktemp)"
            curl -fsSL --retry 5 --retry-all-errors \
              "https://raw.githubusercontent.com/$source_repo/$source_commit/$path" \
              -o "$tmp"
            actual="$(git hash-object "$tmp")"
            test "$actual" = "$expected"
            rm -f "$tmp"
          done

      - name: Resolve exact pinned ggen manufacturer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/manufacturer
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          m = json.loads(Path("SOURCE.lock.json").read_text())["manufacturer"]
          print(f"GGEN_VERSION={m['version']}")
          print(f"GGEN_COMMIT={m['commit']}")
          print(f"GGEN_RELEASE_TAG={m['releaseTag']}")
          print(f"GGEN_ASSET={m['asset']}")
          print(f"GGEN_ASSET_SHA256={m['assetSha256']}")
          PY
          release_dir="$RUNNER_TEMP/ggen-release"
          mkdir -p "$release_dir"
          asset="$RUNNER_TEMP/$GGEN_ASSET"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/seanchatmangpt/ggen/releases/download/$GGEN_RELEASE_TAG/$GGEN_ASSET" \
            -o "$asset"
          echo "$GGEN_ASSET_SHA256  $asset" | sha256sum -c -
          tar -xzf "$asset" -C "$release_dir"
          ggen_bin="$(find "$release_dir" -type f -name ggen | head -n 1)"
          test -n "$ggen_bin"
          chmod +x "$ggen_bin"
          "$ggen_bin" --version | tee evidence/manufacturer/ggen-version.txt
          grep -F "$GGEN_VERSION" evidence/manufacturer/ggen-version.txt
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"

      - name: Manufacture portable skills pass 1
        shell: bash
        run: |
          set -euo pipefail
          "$GGEN_BIN" sync run | tee evidence/ggen-sync-pass1.txt
          "$GGEN_BIN" receipt verify | tee evidence/receipt-verify-pass1.txt
          find skills -type f -name SKILL.md -print0 | sort -z | xargs -0 sha256sum \
            > evidence/skills-pass1.sha256
          test "$(wc -l < evidence/skills-pass1.sha256)" -eq 25
          python3 tools/verify.py | tee evidence/verifier-pass1.json
          python3 -m unittest discover -s tests -v 2>&1 | tee evidence/unittest-pass1.txt

      - name: Replay manufacture and prove fixed projection
        shell: bash
        run: |
          set -euo pipefail
          "$GGEN_BIN" sync run | tee evidence/ggen-sync-pass2.txt
          "$GGEN_BIN" receipt verify | tee evidence/receipt-verify-pass2.txt
          find skills -type f -name SKILL.md -print0 | sort -z | xargs -0 sha256sum \
            > evidence/skills-pass2.sha256
          cmp evidence/skills-pass1.sha256 evidence/skills-pass2.sha256
          python3 tools/verify.py | tee evidence/verifier-pass2.json

      - name: Require committed projections to equal ggen consequence
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all -- skills \
            | tee evidence/projection-drift.txt
          test ! -s evidence/projection-drift.txt

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-skills-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            skills/
            evidence/
          if-no-files-found: warn
